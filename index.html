<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>鐵與灰的等價律</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=DotGothic16&display=swap">
<style>
/* HD-2D 立體透景：點陣角色立在 3D 光影裡；UI 取八方旅人式的深藍金框面板 */
:root{
  --night:#0a0d16;     /* 夜藍底 */
  --panel:#0f1628;     /* 面板 */
  --gild:#c8a456;      /* 金框 */
  --gild-dim:#6b5a33;
  --parch:#efe6d0;     /* 羊皮紙白 */
  --mist:#9aa3b5;
  --amber:#e8892b;     /* 記憶琥珀 */
  --verd:#5cc2ad;      /* 陣法 */
  --crimson:#d0503f;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --pixel:"DotGothic16","Noto Sans TC",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font-family:var(--body);overflow:hidden}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--gild);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;z-index:2}
.px{font-family:var(--pixel)}
.frame{background:linear-gradient(180deg,rgba(23,32,58,.92),rgba(10,14,28,.94));
  border:1px solid var(--gild);box-shadow:inset 0 0 0 3px rgba(10,14,28,.9),inset 0 0 0 4px var(--gild-dim),0 6px 24px rgba(0,0,0,.5)}
/* ---------- Title ---------- */
#title{align-items:flex-start;justify-content:flex-end;gap:16px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(10,13,22,.55),transparent 30%,transparent 55%,rgba(10,13,22,.85))}
.t-logo{position:absolute;top:calc(9vh + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;padding:0 16px}
.t-eyebrow{font-family:var(--pixel);letter-spacing:.3em;font-size:12px;color:var(--gild)}
.t-name{font-family:var(--display);font-weight:900;font-size:clamp(40px,8.4vw,88px);line-height:1.1;margin:8px 0 6px;letter-spacing:.08em;
  text-shadow:0 2px 0 #000,0 0 28px rgba(232,137,43,.45);text-wrap:balance}
.t-name em{font-style:normal;color:var(--amber)}
.t-sub{font-family:var(--pixel);color:var(--mist);font-size:13px;letter-spacing:.18em}
.menu{display:flex;flex-direction:column;gap:8px;min-width:min(300px,88vw);padding:14px}
.mbtn{background:transparent;color:var(--parch);border:0;padding:10px 14px 10px 28px;font-size:16px;text-align:left;position:relative;
  display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--display)}
.mbtn small{font-family:var(--pixel);color:var(--mist);font-size:11px}
.mbtn::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--gild);transform:rotate(45deg) scale(0);transition:transform .15s}
.mbtn:hover::before,.mbtn:focus-visible::before{transform:rotate(45deg) scale(1)}
.mbtn:hover{color:#fff}
.t-foot{font-family:var(--pixel);font-size:11px;color:#6b7590}
@media (max-width:700px){#title{align-items:center}}
/* ---------- Story ---------- */
#story{pointer-events:none}
#story>*{pointer-events:auto}
.st-loc{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  font-family:var(--pixel);font-size:13px;letter-spacing:.08em;color:var(--parch);padding:7px 14px 7px 12px;max-width:calc(100% - 140px)}
.st-loc::before{content:"◆ ";color:var(--gild)}
.st-skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));color:var(--mist);padding:7px 12px;font-size:13px}
.st-box{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:min(960px,calc(100% - 32px));min-height:150px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:16px 20px 14px}
.st-face{width:88px;height:114px;image-rendering:pixelated;align-self:center;border:1px solid var(--gild-dim);background:#0a0f1e}
.st-face[hidden]{display:none}
@media (max-width:560px){.st-face{width:60px;height:78px}.st-box{gap:10px;padding:12px}}
.st-main{min-width:0;display:flex;flex-direction:column}
.st-name{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;min-height:22px}
.st-name b{font-family:var(--display);font-size:19px;color:var(--gild);letter-spacing:.06em}
.st-name span{font-family:var(--pixel);font-size:11px;color:var(--mist)}
.st-text{font-size:clamp(15px,2.1vw,18px);line-height:1.8;min-height:3.6em}
.st-text.narr{color:#cfd3dc;font-style:italic}
.st-next{align-self:flex-end;font-size:11px;color:var(--gild);font-family:var(--pixel);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}
.st-choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.st-choices button{background:rgba(200,164,86,.08);border:1px solid var(--gild-dim);color:var(--parch);padding:9px 14px;text-align:left;font-size:15px}
.st-choices button:hover{border-color:var(--gild)}
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:5}
.fx-flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:#fff}100%{background:transparent}}
/* ---------- Base camp ---------- */
#base{background:rgba(10,13,22,.82);backdrop-filter:blur(2px)}
.bc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--gild-dim)}
.bc-head h2{font-family:var(--display);margin:0;font-size:22px;letter-spacing:.08em}
.bc-head h2 small{font-family:var(--pixel);font-size:11px;color:var(--mist);margin-left:10px;letter-spacing:.1em}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:1px solid var(--gild-dim);color:var(--mist);padding:8px 14px;font-size:14px}
.tab[aria-selected="true"]{border-color:var(--gild);color:var(--gild);background:rgba(200,164,86,.1)}
.bc-body{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.bc-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;max-width:1200px;margin:0 auto}
@media (max-width:860px){.bc-grid{grid-template-columns:minmax(0,1fr)}}
.bc-foot{display:flex;justify-content:flex-end;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--gild-dim)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rcard{border:1px solid #2a3556;background:rgba(15,22,40,.9);padding:10px 12px;text-align:left;color:var(--parch);display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard:hover:not(:disabled){border-color:var(--verd)}
.rcard.eq{border-color:var(--gild);background:linear-gradient(180deg,rgba(200,164,86,.14),rgba(15,22,40,.9))}
.rcard:disabled{opacity:.38;cursor:not-allowed}
.rcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rcard .id{font-family:var(--pixel);font-size:11px;color:var(--gild)}
.rcard .nm{font-weight:700;font-size:15px}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.rcard .ds{font-size:12px;color:#c9c4b4;line-height:1.5}
.chip{border:1px solid #2a3556;padding:1px 6px;font-family:var(--pixel);font-size:11px;white-space:nowrap;color:var(--mist)}
.chip.el{border-color:#2c5a5a;color:#bfeae0}
.panel{padding:16px}
.panel h3{margin:0 0 10px;font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--gild)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1px dashed var(--gild-dim);min-height:52px;padding:8px;font-size:13px;display:flex;flex-direction:column;justify-content:center}
.slot .id{font-family:var(--pixel);font-size:10px;color:var(--gild)}
.mods{display:flex;flex-direction:column;gap:14px}
.modrow h4{margin:0 0 6px;font-size:13px;color:var(--mist);font-weight:500;letter-spacing:.1em}
.modopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.load{height:14px;background:#0a0f1e;border:1px solid var(--gild-dim);position:relative;margin:6px 0 4px}
.load i{position:absolute;inset:0 auto 0 0;background:var(--verd);transition:width .25s}
.load.over i{background:var(--crimson)}
.load .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--parch)}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.stat dt{color:var(--mist)}.stat dd{margin:0;font-family:var(--pixel);font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:12px;color:var(--mist);line-height:1.6}
.warn{color:var(--crimson)}
.btn{background:transparent;border:1px solid var(--gild-dim);color:var(--parch);padding:9px 16px;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--gild)}
.btn.primary{border-color:var(--gild);background:var(--gild);color:#141018;font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---------- Battle ---------- */
#battle{pointer-events:none}
#battle>*{pointer-events:auto}
#battle>.passthru{pointer-events:none}
.hud-top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr minmax(0,1.15fr) 1fr;gap:10px;align-items:start;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-top>*{pointer-events:auto;min-width:0}
.env{padding:8px 12px}
.env b{font-family:var(--display);font-size:15px;display:block}
.env span{font-family:var(--pixel);font-size:11px;color:var(--mist)}
.boss{padding:9px 12px}
.boss .row{display:flex;justify-content:space-between;font-size:12px;gap:8px;font-family:var(--pixel)}
.boss .row b{font-family:var(--display);font-size:14px}
.bar{height:7px;background:#060912;border:1px solid #2a3556;margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .35s}
.bar.hp i{background:linear-gradient(90deg,#8a2a22,var(--crimson))}.bar.tg i{background:linear-gradient(90deg,#8a6a2a,var(--gild))}
.tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{font-family:var(--pixel);font-size:10px;border:1px solid #2a3556;padding:0 5px;color:var(--mist)}
.tag.hot{border-color:var(--amber);color:var(--amber)}
.guide{padding:8px 12px;font-size:12.5px;line-height:1.55}
.guide b{color:var(--verd);font-family:var(--pixel);font-size:11px;letter-spacing:.1em;display:block;margin-bottom:2px}
@media (max-width:760px){.hud-top{grid-template-columns:1fr 1fr}.hud-top .env{display:none}.guide{font-size:11.5px}}
.deck{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) minmax(0,1.35fr);gap:10px;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  max-height:46vh;overflow:auto;background:linear-gradient(0deg,rgba(10,13,22,.9),rgba(10,13,22,.55) 85%,transparent)}
@media (max-width:860px){.deck{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.deck .acts{grid-column:1/-1}}
.ucards{display:flex;flex-direction:column;gap:6px}
.ucard{padding:7px 10px;text-align:left;color:var(--parch);border:1px solid #2a3556;background:rgba(15,22,40,.9)}
.ucard.sel{border-color:var(--gild);box-shadow:inset 3px 0 0 var(--gild)}
.ucard.dead{opacity:.4}
.ucard .r1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ucard .r1 b{font-family:var(--display);font-size:15px}
.ap{display:flex;gap:3px}
.ap i{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--gild)}
.ap i.f{background:var(--gild)}
.ucard .bar i{background:linear-gradient(90deg,#2a7a6a,var(--verd))}
.ucard .st{font-family:var(--pixel);font-size:10px;color:var(--mist);margin-top:3px;min-height:12px}
.pool,.acts{padding:8px 10px}
.pool h5,.acts h5{margin:0 0 6px;font-size:11px;letter-spacing:.14em;color:var(--gild);font-weight:500;font-family:var(--pixel)}
.els{display:flex;gap:5px;flex-wrap:wrap}
.el{border:1px solid #2c5a5a;background:#0c1a22;padding:2px 7px;font-family:var(--pixel);font-size:12px;color:#cfeee6}
.el.zero{opacity:.35}
.anc{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.anc .shape{font-family:var(--pixel);color:var(--gild)}
.abtns{display:flex;flex-wrap:wrap;gap:6px}
.ab{border:1px solid #2a3556;background:rgba(15,22,40,.92);color:var(--parch);padding:6px 9px;font-size:12.5px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.ab small{font-family:var(--pixel);font-size:10px;color:var(--mist)}
.ab:hover:not(:disabled){border-color:var(--verd)}
.ab.on{border-color:var(--verd);background:rgba(92,194,173,.16)}
.ab.rc.ready{border-color:var(--gild);background:rgba(200,164,86,.12)}
.ab:disabled{opacity:.35;cursor:not-allowed}
.ab.forbid{border-color:#6b2a24;color:#f0b3ab}
.ab.end{border-color:var(--gild);color:var(--gild)}
.field-ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.strike{background:var(--amber);color:#141018;border:1px solid #ffd08a;padding:12px 22px;font-weight:700;font-size:15px;letter-spacing:.06em;font-family:var(--display)}
.strike:disabled{background:rgba(15,22,40,.9);color:var(--mist);border-color:var(--gild-dim);cursor:not-allowed}
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-family:var(--display);font-weight:900;z-index:4;
  font-size:clamp(28px,6vw,54px);letter-spacing:.2em;color:var(--parch);text-shadow:0 2px 0 #000,0 0 30px rgba(232,137,43,.7);opacity:0}
.banner.show{animation:ban 1.6s ease-out}
@keyframes ban{0%{opacity:0;letter-spacing:.6em}20%{opacity:1;letter-spacing:.2em}75%{opacity:1}100%{opacity:0}}
.banner small{display:block;font-family:var(--pixel);font-size:13px;letter-spacing:.3em;color:var(--gild);margin-top:6px;font-weight:400}
.ftxt{position:fixed;pointer-events:none;font-family:var(--pixel);font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:4;
  transform:translate(-50%,-50%);animation:ft 1.3s ease-out forwards;white-space:nowrap}
@keyframes ft{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.log{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:150px;width:250px;max-height:30vh;overflow:hidden;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.log div{font-size:11.5px;background:rgba(10,14,28,.82);border-left:2px solid var(--gild-dim);padding:3px 7px;animation:lg 6s forwards}
@keyframes lg{0%{opacity:0}5%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (max-width:760px){.log{display:none}}
.overlay{position:fixed;inset:0;background:rgba(10,13,22,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:6}
.overlay .card{padding:26px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px}
.overlay h3{margin:0;font-family:var(--display);font-size:26px;letter-spacing:.12em}
.overlay p{margin:0;line-height:1.7;color:#d8d2c2}
.overlay .row{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Exploration ---------- */
#explore{pointer-events:none}
#explore>*{pointer-events:auto}
.ex-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.ex-top>*{pointer-events:auto;min-width:0}
.ex-area{padding:8px 14px;max-width:min(460px,62vw)}
.ex-area b{display:block;font-family:var(--display);font-size:17px;letter-spacing:.06em}
.ex-area b::before{content:"◆ ";color:var(--gild);font-size:12px}
.ex-area span{display:block;font-size:12.5px;color:var(--mist);margin-top:3px;line-height:1.5}
.ex-area span::before{content:"目標　";font-family:var(--pixel);color:var(--verd);font-size:11px}
.danger{padding:8px 12px;min-width:150px}
.danger span{font-family:var(--pixel);font-size:12px;letter-spacing:.08em}
.dbar{height:6px;background:#060912;border:1px solid #2a3556;margin-top:5px;position:relative;overflow:hidden}
.dbar i{position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:#5c9ad8;transition:width .2s,background .3s}
.danger[data-lv="mid"] .dbar i{background:var(--amber)}.danger[data-lv="high"] .dbar i{background:var(--crimson)}
.danger[data-lv="high"] span{color:#f0a49a}.danger[data-lv="off"] .dbar{opacity:.3}
.ex-party{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:190px}
.pm{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.pm b{font-family:var(--display);font-size:13px}
.pm .bar{margin:0}.pm .bar i{background:linear-gradient(90deg,#2a7a6a,var(--verd))}
.pm span{font-family:var(--pixel);font-size:11px;color:var(--mist);font-variant-numeric:tabular-nums}
.ex-act{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));color:var(--parch);padding:10px 20px;font-size:15px;font-family:var(--display);
  display:flex;flex-direction:column;align-items:center;gap:2px;animation:pulse 1.6s infinite}
.ex-act small{font-family:var(--pixel);font-size:10px;color:var(--gild);letter-spacing:.2em}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px rgba(10,14,28,.9),inset 0 0 0 4px var(--gild),0 0 18px rgba(200,164,86,.45)}}
.ex-help{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:11px;color:#8a93a8;text-shadow:0 1px 0 #000;max-width:46vw;text-align:right}
@media (max-width:700px){.ex-help{display:none}.ex-party{min-width:150px}.ex-act{bottom:calc(110px + env(safe-area-inset-bottom,0px))}.danger{min-width:110px}}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:10px 18px;font-size:14px;z-index:7;pointer-events:none;opacity:0;max-width:calc(100% - 32px);text-align:center}
.toast.show{animation:tst 3.2s ease-out}
@keyframes tst{0%{opacity:0;margin-top:8px}10%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0}}
/* gear / items / result / camera */
.gear-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;max-width:1200px;margin:0 auto;align-items:start}
.gearcol h3 .px{font-size:13px;color:var(--parch)}
.gh{margin:12px 0 6px;font-size:12px;color:var(--mist);font-weight:500;letter-spacing:.12em}
.glist{display:grid;gap:6px;margin-top:8px}

let faceToken=0;
function drawFace(who,en){
  const cv=$('st-face');if(!who){cv.hidden=true;return;}cv.hidden=false;const tok=++faceToken;
  const img=new Image();img.onload=()=>{if(tok!==faceToken)return;const g=cv.getContext('2d');g.clearRect(0,0,40,52);g.drawImage(img,0,0,40,52);
    const d=g.getImageData(0,0,40,52);for(let i=0;i<d.data.length;i+=4)for(let c=0;c<3;c++)d.data[i+c]=Math.round(d.data[i+c]/36)*36;g.putImageData(d,0,0);};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portraitSVG(who,en));
}

/* ======================= HOOKS: extension points instead of stacked wrappers =======================
   HOOK.after('startBattle', cfg=>{...})   runs after the function, in registration (file) order
   HOOK.before('enterMap', id=>{...})      runs before it
   The hooked functions are listed in engine/hooks-install.js (last file in the manifest). */
const HOOK={b:{},a:{},
  before(n,f){(this.b[n]||(this.b[n]=[])).push(f);},
  after(n,f){(this.a[n]||(this.a[n]=[])).push(f);},
  run(kind,n,args){(this[kind][n]||[]).forEach(f=>{try{f(...args);}catch(e){console.error('hook '+n,e);}});}};

/* ======================= STORY ENGINE ======================= */
const S={list:[],i:0,onEnd:null,typing:false,full:'',actors:{},keep:false};
let typeTimer=null;
const CHOICES={
 amber:[{t:'把琥珀接入克蕾雅的右肩',then:()=>SCENES.ch1self.concat(SCENES.ch1end)},{t:'把琥珀投入抽取塔逆轉幫浦',then:()=>SCENES.ch1end}],
};
function buildSet(name){clearWorld();S.actors={};SETS[name]();E.fxs.push(dt=>{Object.values(S.actors).forEach(s=>{if(s.target)s.holder.position.lerp(s.target,Math.min(1,dt*3));});});}
function applyCast(cast){Object.entries(cast).forEach(([k,[x,z,dir]])=>{const s=charSprite(k);s.holder.position.set(x,0,z);s.face(dir||1);s.target=s.holder.position.clone();E.world.add(s.holder);S.actors[k]=s;});}
function applyStage(L){if(L.set){E.mode='scene';buildSet(L.set);}if(L.cast)applyCast(L.cast);if(L.move)Object.entries(L.move).forEach(([k,[x,z]])=>{const s=S.actors[k];if(s)s.target=new THREE.Vector3(x,0,z);});
  if(L.hide)L.hide.forEach(k=>{const s=S.actors[k];if(s)s.holder.visible=false;});if(L.loc!==undefined)$('st-loc').textContent=L.loc;}
/* opts.keep: play over the current world (exploration), opts.actors maps speakers to existing sprites */
function playScene(list,onEnd,opts={}){
  show('story');S.keep=!!opts.keep;if(opts.actors)S.actors=opts.actors;
  if(!opts.keep)E.mode='scene';
  $('st-loc').hidden=!!opts.keep&&!list.some(l=>l.loc);
  Object.assign(S,{list:list.slice(),i:0,onEnd,typing:false});resize();step();
}
function fx(kind){if(kind==='flash'){const L=$('fxlayer');L.classList.remove('fx-flash');void L.offsetWidth;L.classList.add('fx-flash');}if(kind==='shake')E.shake=1;}
function step(){
  clearInterval(typeTimer);$('st-choices').innerHTML='';
  if(S.i>=S.list.length){const f=S.onEnd;S.onEnd=null;f&&f();return;}
  const L=S.list[S.i];applyStage(L);if(L.loc)$('st-loc').hidden=false;if(L.fx)fx(L.fx);
  if(L.loc&&!L.n&&!L.who&&!L.choice){S.i++;return step();}
  if(L.choice){$('st-name').innerHTML='<b>抉擇</b>';drawFace(null);$('st-text').className='st-text';$('st-text').textContent='';$('st-next').hidden=true;
    (Array.isArray(L.choice)?L.choice:CHOICES[L.choice]).forEach(c=>{const b=document.createElement('button');b.textContent='◆ '+c.t;b.onclick=ev=>{ev.stopPropagation();
      if(c.fn){const f=S.onEnd;S.onEnd=null;S.list=[];c.fn(f);return;}
      S.list=c.then();S.i=0;step();};$('st-choices').appendChild(b);});return;}
  $('st-next').hidden=false;
  if(L.who){$('st-name').innerHTML=`<b>${NAMES[L.who]}</b><span>[${L.e}]</span>`;$('st-text').className='st-text';drawFace(L.who,L.e);const s=S.actors[L.who];if(s)s.hop=1;}
  else{$('st-name').innerHTML='';$('st-text').className='st-text narr';drawFace(null);}
  const txt=L.who?`「${L.t}」`:L.n;S.full=txt;S.typing=true;let k=0;const el=$('st-text');el.textContent='';
  const sp=matchMedia('(prefers-reduced-motion: reduce)').matches?1000:2;
  typeTimer=setInterval(()=>{k+=sp;el.textContent=txt.slice(0,k);if(k>=txt.length){clearInterval(typeTimer);S.typing=false;}},22);
}
function advance(){if($('story').hidden)return;const L=S.list[S.i];if(!L||L.choice)return;if(S.typing){clearInterval(typeTimer);$('st-text').textContent=S.full;S.typing=false;return;}S.i++;step();}
$('st-box').addEventListener('click',advance);
$('st-skip').addEventListener('click',e=>{e.stopPropagation();let j=S.i+1;while(j<S.list.length&&!S.list[j].choice){applyStage(S.list[j]);j++;}S.i=j;step();});

/* ======================= ROUTER ======================= */
function show(id){['title','story','base','battle','explore'].forEach(s=>$(s).hidden=(s!==id));$('ov').innerHTML='';
  if(id==='title'){E.mode='scene';E.controls.enabled=false;buildSet('title');}
  if(id!=='battle')E.controls.enabled=false;
  resize();}
function toast(t){const d=$('toast');d.textContent=t;d.classList.remove('show');void d.offsetWidth;d.classList.add('show');}

/* ======================= BASE CAMP ======================= */
let baseTab='r',baseReturn=null;let CHAPTER=1;
function openBase(onGo,label){baseReturn=onGo||null;$('bc-go').textContent=label||'攜帶目前配裝出擊';
  if(E.mode==='battle'){E.mode='scene';buildSet('title');}show('base');renderBase();}
function renderBase(){
  ['r','w','g'].forEach(t=>$('tab-'+t).setAttribute('aria-selected',baseTab===t));const Bd=$('bc-body');
  if(baseTab==='r'){
    const slots=[0,1,2,3].map(i=>{const r=RBY[save.equip[i]];return `<div class="slot">${r?`<span class="id">#${r.id} · ${SHAPE[r.n]}</span><b>${r.name}</b>`:'<span class="note">空槽：點選配方裝入</span>'}</div>`;}).join('');
    Bd.innerHTML=`<div class="bc-grid"><div><p class="note" style="margin:0 0 10px">點選配方裝入或卸下出擊快捷列（最多 4 招）。灰色配方在之後的章節解鎖；#R15 禁忌配方常駐於戰鬥列，不佔欄位。3 點以上的陣可以直接使用陣內網格的物質。</p>
      <div class="rlist">${RECIPES.map(r=>{const locked=r.ch>CHAPTER,eq=save.equip.includes(r.id),sp=r.id==='R15'||r.id==='R30';
        return `<button class="rcard${eq?' eq':''}" data-r="${r.id}" ${locked||sp?'disabled':''}><div class="top"><span class="id">#${r.id}${locked?` · 第 ${r.ch} 章解鎖`:''}</span><span class="id">${r.ap} AP</span></div>
        <div class="nm">${r.name}</div><div class="meta"><span class="chip">${SHAPE[r.n]}</span>${r.el.map(e=>`<span class="chip el">${ELF[e]||e}</span>`).join('')}</div><div class="ds">${r.desc}</div></button>`;}).join('')}</div></div>
      <aside class="panel frame" style="align-self:start;position:sticky;top:0"><h3>出擊戰術快捷列</h3><div class="slots">${slots}</div>
      <p class="note" style="margin-top:12px">小型遭遇戰的敵人裝甲薄，#R06 電網、#R08 鐵枷能一次控制好幾隻。BOSS 機甲的背部水箱會噴出積水，#R09 把三角陣內的積水電解成氫氧氣雲，再用火銃或 #R07 引爆。</p></aside></div>`;
    Bd.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const id=b.dataset.r,k=save.equip.indexOf(id);if(k>=0)save.equip.splice(k,1);else if(save.equip.length<4)save.equip.push(id);else{save.equip.shift();save.equip.push(id);}persist();renderBase();});
  }else if(baseTab==='g'){renderGear(Bd);
  }else{
    const s=claireStats(save.mods),cap=save.cap,over=s.load>cap;
    Bd.innerHTML=`<div class="bc-grid"><div class="mods">${Object.entries(MODS).map(([k,g])=>`<div class="modrow"><h4>${g.label}</h4><div class="modopts">${g.opts.map(o=>`
      <button class="rcard${save.mods[k]===o.id?' eq':''}" data-k="${k}" data-m="${o.id}"><div class="top"><span class="id">${o.id}</span><span class="id">${o.load} Load</span></div>
      <div class="nm">${o.name}</div><div class="meta">${o.hp?`<span class="chip">HP ${o.hp>0?'+':''}${o.hp}</span>`:''}${o.arm?`<span class="chip">護甲 +${o.arm}</span>`:''}${o.atk?`<span class="chip">攻擊 +${o.atk}</span>`:''}${o.mv?`<span class="chip">移動 ${o.mv>0?'+':''}${o.mv}</span>`:''}</div>
      <div class="ds">${o.skill}</div></button>`).join('')}</div></div>`).join('')}</div>
      <aside class="panel frame" style="align-self:start;position:sticky;top:0"><h3>赫菲斯托斯 Mk.IV</h3>
      <div class="note">神經負荷 <span class="px">${s.load} / ${cap} Load</span>${over?' <b class="warn">超載</b>':''}</div>
      <div class="load${over?' over':''}"><i style="width:${Math.min(100,s.load/1.2)}%"></i><span class="cap" style="left:${cap/1.2}%"></span></div>
      <dl class="stat" style="margin-top:12px"><dt>HP</dt><dd>${s.hp}</dd><dt>護甲</dt><dd>${s.arm}</dd><dt>攻擊</dt><dd>${s.atk}</dd><dt>移動</dt><dd>${s.mv} 格</dd></dl>
      <p class="note" style="margin-top:12px">${over?'<span class="warn">超過上限時，克蕾雅的技能傷害 +30%，但每次施放扣 10 HP。</span>':'在上限內配裝，沒有神經反噬。'}</p>
      ${cap<100?`<p class="note warn">使用過禁忌超載逆構，神經負荷上限降到 ${cap}。</p><button class="btn" id="recal">花一晚重新校準神經（上限回到 100）</button>`:''}</aside></div>`;
    Bd.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{save.mods[b.dataset.k]=b.dataset.m;persist();syncMax();renderBase();});
    const rc=$('recal');if(rc)rc.onclick=()=>{save.cap=100;persist();renderBase();};

  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);HALO=new THREE.CanvasTexture(c);return HALO;}

function parts(p,{n=30,c=0xffffff,spd=2,up=1,grav=3,dur=.9,size=.12,spread=.3,converge=false,delay=0,drag=0}={}){

function xformPose(base,{rot=0,dx=0,dy=0,sx=1,sy=1,over=null}){

  if(over){const P=(col,x,y,w=1,h=1)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};over(P);}return c;}
function poseCanvas(kind,pose,tank){
  if(['ryan','claire','miner','guard'].includes(kind)){if(kind==='claire'&&pose==='cast')pose='aim';return humanPose(kind,pose);}
  if(kind==='hound'){const b=houndCanvas(0);
    if(pose==='wind')return xformPose(b,{rot:-.12,dx:-2,dy:1,sy:.9});
    if(pose==='strike')return xformPose(b,{rot:.1,dx:2,sx:1.08,over:P=>{P('#ff5a3a',25,9,2,1);P('#f4f0e0',24,9,1,1);}});
    if(pose==='hurt')return xformPose(b,{rot:-.2,dx:-2});}
  if(kind==='sweeper'){const b=sweeperCanvas(0);
    if(pose==='wind')return xformPose(b,{rot:-.08,dy:-1,over:P=>{P('#9aa2aa',1,6,1,6);P('#9aa2aa',22,6,1,6);}});
    if(pose==='strike')return xformPose(b,{rot:.1,dx:1,over:P=>{P('#c8ff70',19,12,3,2);P('#4ab830',21,11,2,1);}});
    if(pose==='hurt')return xformPose(b,{rot:-.18,dx:-1});}
  if(kind==='mech'){const b=mechCanvas(0,tank);
    if(pose==='wind')return xformPose(b,{rot:-.07,dy:-2,over:P=>{P('#ff6a4a',22,14,5,2);}});
    if(pose==='strike')return xformPose(b,{rot:.05,dx:1,dy:1,over:P=>{P('#fff2a0',34,17,2,3);P('#ffb060',33,16,1,5);}});

function getPose(s,pose){
  if(!s||!s.kind||!pose)return null;const tank=s.kind==='mech'&&B&&B.mechFrames?s.frames===B.mechFrames.tank:true;
  const key=s.kind+'|'+pose+'|'+tank;if(!(key in POSE_CACHE)){const c=poseCanvas(s.kind,pose,tank);POSE_CACHE[key]=c?tex(c):null;}return POSE_CACHE[key];}

/* ---- motion helpers ---- */
const asleep=ms=>new Promise(r=>setTimeout(r,ms));
function tweenOff(s,to,dur){return new Promise(res=>{const from=s.mesh.position.clone();from.y=0;let t=0;
  E.fxs.push(dt=>{t+=dt;const k=Math.min(1,t/dur),e=1-Math.pow(1-k,3);s.mesh.position.x=from.x+(to.x-from.x)*e;s.mesh.position.z=from.z+(to.z-from.z)*e;if(k>=1){res();return false;}});
  setTimeout(res,dur*1000+600);});}
function faceTo(s,target){const p=s.holder.position,sx=scrX(target.x-p.x,target.z-p.z);if(Math.abs(sx)>.01)s.face(sx);}
function hitFlash(s,col=0xffffff){if(!s)return;s.mat.emissive.setHex(col);s.mat.emissiveIntensity=1;let t=0;
  E.fxs.push(dt=>{t+=dt;if(t>.09){s.mat.emissive.setHex(0x1c1c26);return false;}});}
function hitReact(s,fromPos,heavy){
  if(!s||!s.holder.visible)return;hitFlash(s);const prev=s.pose;
  if(!s.busy)setPose(s,'hurt');
  const p=s.holder.position,d=fromPos?V3(p.x-fromPos.x,0,p.z-fromPos.z):V3(0,0,1);if(d.lengthSq()<1e-4)d.set(0,0,1);d.normalize().multiplyScalar(heavy?.32:.18);
  s.mesh.position.x=d.x;s.mesh.position.z=d.z;let t=0;
  E.fxs.push(dt=>{t+=dt;const k=Math.min(1,t/.32);s.mesh.position.x=d.x*(1-k)+(Math.random()-.5)*.04*(1-k);s.mesh.position.z=d.z*(1-k);
    if(k>=1){s.mesh.position.x=0;s.mesh.position.z=0;if(!s.busy)s.pose=null;return false;}});
}
function hitstop(sec){E.hs=Math.max(E.hs||0,sec);}
/* att: sprite, target: world pos; impact(): runs at the hit frame */
async function animAttack(att,target,o,impact){
  if(!att){impact&&impact();return;}
  att.busy=true;faceTo(att,target);
  const p=att.holder.position,dir=V3(target.x-p.x,0,target.z-p.z);const dist=dir.length();dir.normalize();
  setPose(att,'wind');await tweenOff(att,dir.clone().multiplyScalar(-.12),.14);await asleep(o.heavy?140:70);
  if(o.ranged||o.cast){setPose(att,o.cast?'cast':'strike');await asleep(60);impact&&impact();hitstop(.05);await asleep(o.cast?380:260);}
  else{const reach=Math.max(0,Math.min(o.lunge||.5,dist-.55));setPose(att,'strike');await tweenOff(att,dir.clone().multiplyScalar(reach),.08);
    impact&&impact();hitstop(o.heavy?.12:.07);await asleep(o.heavy?260:200);}
  await tweenOff(att,V3(0,0,0),.16);att.pose=null;att.busy=false;
}

  const d=g.getImageData(0,0,cv.width,cv.height);for(let i=0;i<d.data.length;i+=4)for(let c=0;c<3;c++)d.data[i+c]=Math.round(d.data[i+c]/36)*36;g.putImageData(d,0,0);};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portraitSVG(who,expr));}
function camPush(toPos,amount,dur){const t0=E.controls.target.clone(),c0=E.camera.position.clone(),tt=toPos.clone().setY(.7),ct=c0.clone().lerp(tt,amount);let t=0;

const isUnit=x=>!!(x&&x.key);
function slideFrom(x,di,dj){let n=0;if(!di&&!dj)return 0;
  while(B.tiles[x.i][x.j]==='ice'){const ni=x.i+di,nj=x.j+dj,h0=hAt(x.i,x.j);
    if(!inb(ni,nj)||occupied(ni,nj,x)||hAt(ni,nj)>h0){if(n||!isUnit(x)){const who=enemyAt(ni,nj);if(!isUnit(x)&&x.alive){damageEnemy(x,30,{raw:true});floatAt(W(x.i,x.j),'撞擊','#9fd4ff');if(who&&who!==x)damageEnemy(who,20,{raw:true});E.shake=.5;}}break;}
    x.i=ni;x.j=nj;n++;if(hAt(ni,nj)<h0){fallHit(x,h0-hAt(ni,nj));break;}if(n>12)break;}
  if(n){placeUnits(false);floatAt(W(x.i,x.j),'滑行 '+n+' 格','#bff4ff');burst(W(x.i,x.j),0xd8f4ff,18,1.2);}
  return n;}
function fallHit(x,dh){if(dh<=0)return;const d=40*dh;if(isUnit(x)){damageUnit(x,Math.round(d*.5));}else{damageEnemy(x,d,{raw:true});floatAt(W(x.i,x.j),'墜落','#ffd27a');}E.shake=.6;}
function CH2DO(mode,u,e,bi,bj,ebi,ebj,i,j){
  if(mode==='move'&&(u.i!==bi||u.j!==bj)){const di=u.i-bi,dj=u.j-bj,ax=Math.abs(di)>=Math.abs(dj);
    if(B.tiles[u.i][u.j]==='ice'){log(`${u.name}踩上冰面，煞不住腳……`);slideFrom(u,ax?Math.sign(di):0,ax?0:Math.sign(dj));}}
  if(mode==='pile'&&e){const di=Math.sign(ebi-u.i),dj=Math.sign(ebj-u.j);
    if(e.alive&&(e.i!==ebi||e.j!==ebj)){const dh=hAt(ebi,ebj)-hAt(e.i,e.j);if(dh>0)fallHit(e,dh);else if(e.alive&&B.tiles[e.i][e.j]==='ice'){log(`${e.name}被打飛到冰面上一路滑出去！`);slideFrom(e,di,dj);}}
    else if(e.alive){const ni=ebi+di,nj=ebj+dj;if(!inb(ni,nj)||B.tiles[ni]&&B.tiles[ni][nj]==='wall'||hAt(ni,nj)>hAt(ebi,ebj)){damageEnemy(e,25,{raw:true});floatAt(W(e.i,e.j),'撞牆','#c8a456');}}}
}

 fortressIn:[

  {who:'locke',e:'Default_Cold',t:'異狀？我的兵一個也沒少。該站崗的站崗，該巡邏的巡邏。他們比以前更守紀律——不吵、不怕、不想家。'},

  {who:'claire',e:'Neutral',t:'你是艾瑞克？莉亞的哥哥？'},
  {who:'erik',e:'Neutral',t:'莉亞……是啊，我妹妹。她燉的肉很好吃。我記得。'},
  {who:'claire',e:'Hurt',t:'她很擔心你。她在冰河口等著。'},
  {who:'erik',e:'Neutral',t:'擔心……我知道那是什麼意思。可是我想不起來，那是什麼感覺。'},
  {who:'erik',e:'Neutral',t:'每個月，我們會被叫去東塔地下做「低溫適應處置」。睡一覺起來，身體就不怕冷了。歐利克大人說，這樣我們在零下四十度也能站崗。'},
  {who:'ryan',e:'Fork_Gaze',t:'把士兵的情緒抽走，讓他們不怕冷、不怕死……這是在把人造成兵器。'},

 orrickMeet:[
  {n:'冰窖最深處，一座巨大的黃銅擺鐘佇立在中央。擺錘每晃一次，整座地窖的結晶就跟著亮一下。'},
  {who:'orrick',e:'Smile',t:'歡迎。中央的灰瞳少校，還有……赫菲斯托斯的小主人。薇拉跟我提過你們。'},
  {who:'ryan',e:'Default_Cold',t:'寒霜鍊金術師歐利克。你和薇拉是同一夥的。'},
  {who:'orrick',e:'Smile',t:'同一夥？我們只是一群相信「效率」的研究者。情緒是人類最浪費的熱量——恐懼、思念、憤怒。我只是把它們收集起來。'},
  {who:'orrick',e:'Default_Cold',t:'士兵不再怕冷、不再想家，要塞永不陷落。這有什麼不對？'},
  {who:'claire',e:'Angry_Steam',t:'你把人變成了不會哭的機器！'},
  {who:'orrick',e:'Smile',t:'說到哭——准尉，妳不記得了吧？零號實驗室裡，是誰把妳推出門外的。'},
  {n:'克蕾雅僵住了。'},
  {who:'orrick',e:'Smile',t:'……原來如此。少校，你沒有告訴她。真是溫柔的謊言。'},
  {who:'ryan',e:'AshEye_Overload',t:'閉嘴。'},
  {who:'orrick',e:'Default_Cold',t:'那就讓擺錘替我說吧。——永凍鍾擺，起動。'},

 bossPost:[
  {n:'鍾擺的核心碎裂。滿室的結晶同時迸出光芒，暖流像潮水一樣往上湧——三百多名士兵的情緒，正在回到他們身上。'},
  {who:'orrick',e:'Default_Cold',t:'……可惜。真的很可惜。'},
  {n:'歐利克退入寒霧之中。冰面裂開又閉合，只留下一陣笑聲在地窖裡迴盪。'},
  {n:'一塊碎掉的結晶滾到克蕾雅腳邊。和其他的不同，它的光是銀白色的。'},
  {n:'克蕾雅撿起它的瞬間，眼前一白——',fx:'flash'},
  {n:'——紅色的警報燈。崩塌的實驗室。一個穿著白袍、戴著圓眼鏡的男人，用盡全力把她推出門外。'},
  {who:'howard',e:'Smile',t:'克蕾雅，聽好——妳的手很巧，以後一定能做出比我更好的東西。……去吧。'},
  {n:'門關上了。結晶的光吞沒了一切。'},
  {who:'claire',e:'Cry',t:'……那個人是誰？'},
  {who:'claire',e:'Teary_Fierce',t:'我不認識他。可是……為什麼我在哭？萊恩，為什麼我的眼淚停不下來？'},
  {who:'ryan',e:'Fork_Gaze',t:'……'},
  {who:'claire',e:'Teary_Fierce',t:'他就是「霍華德」，對不對？你在醫院說，他只是研究院的一位主任。萊恩，你看著我說。'},
  {who:'ryan',e:'Fork_Gaze',t:'……他是我們的老師。是他把妳推出了零號實驗室。'},
  {who:'claire',e:'Hurt',t:'……為什麼要騙我？'},
  {who:'ryan',e:'Fork_Gaze',t:'因為妳肩膀裡的結晶在吃妳的記憶。我怕妳想起他的那一刻，會連剩下的都一起失去。'},
  {n:'克蕾雅沒有回答。她把銀白色的結晶小心地收進胸前的口袋，轉身走向鐵梯。'},
  {who:'claire',e:'Hurt',t:'……剩下的，等我自己想起來。在那之前——不准再對我說謊。'},
 ],

  const sh=new THREE.Mesh(new THREE.CircleGeometry(w*.38,14),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.scale.y=.45;sh.position.y=.03;g.add(sh);
  if(CRITTER_ART[kind])new THREE.TextureLoader().load('env/cr_'+kind+'.webp',tt=>{mat.map=tt;mat.emissive.set(0x26262e);mat.needsUpdate=true;const ar=tt.image.width/tt.image.height;p.scale.set(ar/1.2*1.25,1.25,1);p.position.y=h*.625;});
  g.position.set(x,0,z);E.world.add(g);E.fxs.push((dt,tm)=>{if(!g.parent)return false;const c=E.camera.position;p.rotation.y=Math.atan2(c.x-x,c.z-z);p.position.y=h*p.scale.y/2+Math.abs(Math.sin(tm*1.6))*.015;});return g;}
function pawTrail(x0,z0,x1,z1){const L=Math.hypot(x1-x0,z1-z0),n=Math.floor(L/.7),ang=Math.atan2(x1-x0,z1-z0),m=new THREE.MeshBasicMaterial({color:0x4a5464,transparent:true,opacity:.55,depthWrite:false});
  for(let k=1;k<n;k++){const t=k/n,s=(k%2?.12:-.12),px=x0+(x1-x0)*t+Math.cos(ang)*s,pz=z0+(z1-z0)*t-Math.sin(ang)*s;
    const d=new THREE.Mesh(new THREE.CircleGeometry(.09,8),m);d.rotation.x=-Math.PI/2;d.scale.y=1.3;d.position.set(px,.02,pz);E.world.add(d);}}

function slotMenu(mode,onPick){
  const draw=(confirmN)=>{const rows=[1,2,3].map(n=>{const d=readSlot(n);
    const info=d?`<b>${slotWhere(d)}</b><span class="px">第${d.ch===2?'二':'一'}章・萊恩 Lv ${d.P.lv.ryan.lv}・克蕾雅 Lv ${d.P.lv.claire.lv}・${d.P.money||0} ${MK}</span><span class="px">遊玩 ${fmtPlay(d.P.play)}・${new Date(d.t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>`:'<b class="empty">空白欄位</b>';
    let btn='';if(mode==='load')btn=d?`<button class="btn primary" data-load="${n}">讀取</button><button class="btn" data-del="${n}">刪除</button>`:'';
    else btn=confirmN===n?`<button class="btn primary" data-pick="${n}">確定覆蓋</button><button class="btn" data-cancel>取消</button>`:`<button class="btn ${d?'':'primary'}" data-${d?'ask':'pick'}="${n}">${d?'覆蓋':'使用'}</button>`;
    if(mode==='load'&&confirmN===n)btn=`<button class="btn primary" data-delok="${n}">確定刪除</button><button class="btn" data-cancel>取消</button>`;
    return`<div class="slot-row"><div class="slot-n">${n}</div><div class="slot-i">${info}</div><div class="slot-b">${btn}</div></div>`;}).join('');

    const ov=$('ov');
    ov.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{$('ov').innerHTML='';loadSlot(+b.dataset.load);});
    ov.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>draw(+b.dataset.del));

    ov.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>draw());
    ov.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{$('ov').innerHTML='';SLOT=+b.dataset.pick;onPick();});
    $('slot-x').onclick=()=>{$('ov').innerHTML='';};};
  draw();}

const SIL_KIND={keeper:'broad',folkA:'cap',folkB:'scarf',folkC:'peak',soldier:'helmet',miner:'cap'};
function silhouette(who){if(SIL[who]!==undefined)return SIL[who];const kind=SIL_KIND[who]||'plain';
  const W=380,H=560,c=cvs(W,H),g=c.getContext('2d');
  const body=(gc)=>{gc.beginPath();const sw=kind==='broad'?168:kind==='scarf'?132:150,cx=W/2,sy=340;
    // shoulders and torso
    gc.moveTo(cx-sw,H);gc.bezierCurveTo(cx-sw,sy+70,cx-sw+30,sy+8,cx-56,sy-6);gc.lineTo(cx-34,sy-40);gc.lineTo(cx+34,sy-40);gc.lineTo(cx+56,sy-6);
    gc.bezierCurveTo(cx+sw-30,sy+8,cx+sw,sy+70,cx+sw,H);gc.closePath();gc.fill();
    // head
    const hy=kind==='broad'?236:228,hr=kind==='broad'?70:64;gc.beginPath();gc.ellipse(cx,hy,hr*.86,hr,0,0,Math.PI*2);gc.fill();
    // headwear
    gc.beginPath();
    if(kind==='cap'){gc.ellipse(cx-4,hy-38,64,34,-.08,Math.PI,0);gc.fill();gc.beginPath();gc.ellipse(cx+40,hy-26,46,10,-.12,0,Math.PI*2);gc.fill();}
    if(kind==='peak'){gc.rect(cx-62,hy-82,124,46);gc.fill();gc.beginPath();gc.ellipse(cx+18,hy-34,74,12,0,0,Math.PI*2);gc.fill();}
    if(kind==='helmet'){gc.ellipse(cx,hy-20,82,66,0,Math.PI,0);gc.fill();gc.beginPath();gc.ellipse(cx,hy-20,96,12,0,0,Math.PI*2);gc.fill();}
    if(kind==='scarf'){gc.moveTo(cx-78,hy+40);gc.bezierCurveTo(cx-98,hy-60,cx-40,hy-104,cx,hy-102);gc.bezierCurveTo(cx+40,hy-104,cx+98,hy-60,cx+78,hy+40);gc.lineTo(cx+60,sy+10);gc.lineTo(cx-60,sy+10);gc.closePath();gc.fill();}
    if(kind==='broad'){gc.ellipse(cx,sy+40,120,60,0,0,Math.PI*2);gc.fill();}};
  const layer=(fill,dx,dy,blur)=>{const t=cvs(W,H),tg=t.getContext('2d');tg.translate(dx,dy);tg.fillStyle=fill;body(tg);if(blur){g.filter=`blur(${blur}px)`;}g.drawImage(t,0,0);g.filter='none';};
  layer('rgba(140,170,220,.7)',-6,-4,2);layer('rgba(220,150,90,.35)',5,0,2);
  const gr=g.createLinearGradient(0,120,0,H);gr.addColorStop(0,'#252b3c');gr.addColorStop(.5,'#141824');gr.addColorStop(1,'#06070b');layer(gr,0,0,0);
  const fade=g.createLinearGradient(0,H*.8,0,H);fade.addColorStop(0,'rgba(0,0,0,0)');fade.addColorStop(1,'rgba(0,0,0,1)');

/* tilt-shift with an in-focus band in the middle (the "diorama" look) */
function tiltShader(dir){return{uniforms:{tDiffuse:{value:null},h:{value:1/512},v:{value:1/512},r:{value:.5},band:{value:.1}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float h,v,r,band;varying vec2 vUv;
   void main(){float k=max(0.,abs(r-vUv.y)-band)*1.6;vec2 o=${dir==='h'?'vec2(h*k,0.)':'vec2(0.,v*k)'};vec4 s=vec4(0.);
    s+=texture2D(tDiffuse,vUv-4.*o)*.051;s+=texture2D(tDiffuse,vUv-3.*o)*.0918;s+=texture2D(tDiffuse,vUv-2.*o)*.12245;s+=texture2D(tDiffuse,vUv-o)*.1531;
    s+=texture2D(tDiffuse,vUv)*.1633;s+=texture2D(tDiffuse,vUv+o)*.1531;s+=texture2D(tDiffuse,vUv+2.*o)*.12245;s+=texture2D(tDiffuse,vUv+3.*o)*.0918;s+=texture2D(tDiffuse,vUv+4.*o)*.051;gl_FragColor=s;}`};}

   lift:{value:new THREE.Vector3(.35,.2,.6)},gain:{value:new THREE.Vector3(1.05,1,.92)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float vig,sat,con,warm,grain,ca,time;uniform vec3 lift,gain;varying vec2 vUv;
   float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
   void main(){vec2 dc=vUv-.5;float a=ca*.012*dot(dc,dc)*4.;
    vec3 c=vec3(texture2D(tDiffuse,vUv+dc*a).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-dc*a).b);
    float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,sat);
    float sh=1.-smoothstep(.02,.32,l),hi=smoothstep(.45,1.,l);
    vec3 tint=1.+(lift-vec3((lift.x+lift.y+lift.z)/3.))*.4;c*=mix(vec3(1.),tint,sh);c*=mix(vec3(1.),gain,hi);

    c*=smoothstep(.95,.3,length(dc)*vig);

const VFX={
 add(o,life,upd){E.world.add(o);let t=0;E.fxs.push(dt=>{t+=dt;const k=Math.min(1,t/life);if(upd)upd(k,dt,t);if(k>=1){E.world.remove(o);o.traverse&&o.traverse(m=>{m.geometry&&m.geometry.dispose();});return false;}});return o;},
 mat(color,op=1){return new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});},
 ring(p,color,r0,r1,life=.6,y=.06,w=.12){const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),this.mat(color));m.rotation.x=-Math.PI/2;m.position.set(p.x,p.y+y,p.z);
   return this.add(m,life,k=>{const r=r0+(r1-r0)*(1-(1-k)**3);m.scale.set(r,r,r);m.material.opacity=(1-k)**1.5;});},
 light(p,color,I,life=.5,dist=9){I*=.5;const l=new THREE.PointLight(color,I,dist);l.position.set(p.x,p.y+1.1,p.z);return this.add(l,life,k=>{l.intensity=I*(1-k)**2;});},
 pillar(p,color,h=3,life=.9,r=.22){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.3,h,16,1,true),this.mat(color,.0));m.position.set(p.x,p.y+h/2,p.z);
   return this.add(m,life,k=>{m.material.opacity=Math.sin(k*Math.PI)*.35;m.scale.x=m.scale.z=1+k*.6;});},
 parts(p,{color=0xffffff,n=30,spd=2,up=1,grav=4,size=.12,life=1,spread=.3,y=.4,drag=0}={}){
   const g=new THREE.BufferGeometry(),a=new Float32Array(n*3),v=[];for(let q=0;q<n;q++){a[q*3]=p.x+(rnd()-.5)*spread;a[q*3+1]=p.y+y+(rnd()-.5)*spread*.5;a[q*3+2]=p.z+(rnd()-.5)*spread;
     const th=rnd()*Math.PI*2,s=spd*(.4+rnd()*.6);v.push([Math.cos(th)*s,up*spd*(.3+rnd()),Math.sin(th)*s]);}
   g.setAttribute('position',new THREE.BufferAttribute(a,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({color,size,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
   return this.add(pts,life,(k,dt)=>{for(let q=0;q<n;q++){v[q][1]-=grav*dt;if(drag){v[q][0]*=1-drag*dt;v[q][2]*=1-drag*dt;}a[q*3]+=v[q][0]*dt;a[q*3+1]=Math.max(.03,a[q*3+1]+v[q][1]*dt);a[q*3+2]+=v[q][2]*dt;}
     g.attributes.position.needsUpdate=true;pts.material.opacity=(1-k)**1.2;});},
 spikes(p,color,n=7,h=1.3,life=1.1){const g=new THREE.Group();g.position.set(p.x,p.y,p.z);const mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.6,roughness:.2,metalness:.1,transparent:true,flatShading:true});

/* ======================= GRAPHICS LEVELS + AUTOMATIC DOWNGRADE =======================
   high: full post-processing, up to 2× pixel ratio      std: lighter post, up to 1.5×
   low : no bloom, no shadows, 1× (0.85× on high-DPI)    auto: start from a device guess, step down while FPS stays low */
save.gfx=save.gfx||'auto';
const GFX_NAME={auto:'自動',high:'高',std:'標準',low:'省電'};
let GFX_LV=save.gfx==='auto'?(save.gfxAuto||guessGfx()):save.gfx;
function guessGfx(){const mob=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||matchMedia('(pointer:coarse)').matches;
  const mem=navigator.deviceMemory||8,cpu=navigator.hardwareConcurrency||8;return mob||mem<=4||cpu<=4?'std':'high';}
function applyGfx(lv){GFX_LV=lv;const dpr=window.devicePixelRatio||1;
  save.postQ=lv==='high'?'high':'std';
  const pr=lv==='high'?Math.min(2,dpr):lv==='std'?Math.min(1.5,dpr):(dpr>1.5?.85:1);
  E.renderer.setPixelRatio(pr);if(E.composer.setPixelRatio)E.composer.setPixelRatio(pr);
  const sh=lv!=='low';if(E.renderer.shadowMap.enabled!==sh){E.renderer.shadowMap.enabled=sh;E.scene.traverse(o=>{if(o.material){[].concat(o.material).forEach(m=>m.needsUpdate=true);}});}
  E.bloom.enabled=lv!=='low';

/* FPS watch: only while actually playing (explore / battle), 4-second windows */
const PERF={frames:0,t:0,low:0,warned:false};
function perfTick(dt){if(save.gfx!=='auto'||document.hidden||!(E.mode==='explore'||E.mode==='battle')||(typeof LOAD!=='undefined'&&!LOAD.ready)){PERF.frames=0;PERF.t=0;return;}
  PERF.frames++;PERF.t+=dt;if(PERF.t<4)return;const fps=PERF.frames/PERF.t;PERF.frames=0;PERF.t=0;PERF.last=Math.round(fps);
  if(fps<42&&GFX_LV!=='low'){PERF.low++;if(PERF.low>=2){PERF.low=0;const nl=GFX_LV==='high'?'std':'low';save.gfxAuto=nl;persist();applyGfx(nl);
      toast(`畫面不夠流暢（約 ${Math.round(fps)} FPS），已自動把畫質調成「${GFX_NAME[nl]}」。可以在 選單 → 設定 調整。`);}}
  else PERF.low=0;}
