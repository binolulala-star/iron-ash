let story={list:[],i:0,onEnd:null,typing:false,full:''};

}
function setBg(k){ $('st-bg').style.background=BG[k]||BG.black; }
function fx(kind){
  const L=$('fxlayer');
  if(kind==='flash'){L.classList.remove('fx-flash');void L.offsetWidth;L.classList.add('fx-flash');}
  if(kind==='shake'){const s=$('story');s.classList.remove('fx-shake');void s.offsetWidth;s.classList.add('fx-shake');}
}
const NAMES={ryan:'萊恩',claire:'克蕾雅',vera:'ヴェラ（水銀）',howard:'霍華德教授'};
function step(){
  clearInterval(typeTimer);
  $('st-choices').innerHTML='';
  if(story.i>=story.list.length){ const f=story.onEnd; story.onEnd=null; f&&f(); return; }
  const L=story.list[story.i];
  if(L.bg) setBg(L.bg);
  if(L.loc!==undefined){ $('st-loc').textContent=L.loc; }
  if(L.fx) fx(L.fx);
  if(L.loc && !L.n && !L.who && !L.choice){ story.i++; return step(); }
  if(L.choice){
    $('st-name').innerHTML='<b>抉擇</b>';
    $('st-text').className='st-text'; $('st-text').textContent='';
    $('st-next').textContent='';
    L.choice.forEach(c=>{const b=document.createElement('button');b.textContent=c.t;b.onclick=(ev)=>{ev.stopPropagation();
      const rest=story.list.slice(story.i+1); const seq=(c.go==='self'?SCENES.ch1self:[]).concat(SCENES.ch1end).concat(rest);
      story.list=seq; story.i=0; step();};$('st-choices').appendChild(b);});
    return;
  }
  $('st-next').textContent='點擊或按空白鍵繼續';
  if(L.who){
    const slot=L.side==='r'?'pt-r':'pt-l', other=L.side==='r'?'pt-l':'pt-r';
    $(slot).innerHTML=portrait(L.who,L.e); $(slot).classList.add('on'); $(other).classList.remove('on');
    $('st-name').innerHTML=`<b>${NAMES[L.who]}</b><span>[${L.e}]</span>`;
    $('st-text').className='st-text';
  }else{
    $('st-name').innerHTML=''; $('pt-l').classList.remove('on'); $('pt-r').classList.remove('on');
    $('st-text').className='st-text narr';
  }
  const txt=L.who?`「${L.t}」`:L.n; story.full=txt; story.typing=true;
  let k=0; const el=$('st-text'); el.textContent='';
  const speed = matchMedia('(prefers-reduced-motion: reduce)').matches?1000:2;
  typeTimer=setInterval(()=>{k+=speed;el.textContent=txt.slice(0,k);if(k>=txt.length){clearInterval(typeTimer);story.typing=false;}},22);
}
function advance(){
  if($('story').hidden) return;
  const L=story.list[story.i]; if(!L||L.choice) return;
  if(story.typing){clearInterval(typeTimer);$('st-text').textContent=story.full;story.typing=false;return;}
  story.i++; step();
}
$('st-box').addEventListener('click',advance);
$('st-skip').addEventListener('click',e=>{e.stopPropagation();

function refreshTile(i,j){

function rebuildAnchors(){
  const G=B.anchorGroup; while(G.children.length)G.remove(G.children[0]);
  const pts=B.anchors.map(a=>{const v=W(a.i,a.j);v.y=.08;return v;});
  B.anchors.forEach((a,k)=>{const o=new THREE.Mesh(new THREE.OctahedronGeometry(.16),new THREE.MeshBasicMaterial({color:0xffd27a}));
    o.position.copy(pts[k]);o.position.y=.45;o.userData.spin=true;
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.9,6),new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:.5}));beam.position.copy(pts[k]);beam.position.y=.45;
    G.add(o,beam);});
  const n=pts.length;
  if(n>=2){
    const col=n===2?0x4fd1e0:n===3?0x4fe08a:0xe0465a;
    const ring=n>=3?orderPoly(pts.slice()):pts.slice();
    const lp=ring.concat(n>=3?[ring[0]]:[]);
    const lg=new THREE.BufferGeometry().setFromPoints(lp.map(p=>new THREE.Vector3(p.x,.1,p.z)));

      const f=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));
      f.rotation.x=-Math.PI/2;f.position.y=.06;G.add(f);}

  renderDeck();
}
function orderPoly(pts){const c=pts.reduce((a,p)=>({x:a.x+p.x/pts.length,z:a.z+p.z/pts.length}),{x:0,z:0});
  return pts.sort((a,b)=>Math.atan2(a.z-c.z,a.x-c.x)-Math.atan2(b.z-c.z,b.x-c.x));}
function rebuildGas(){
  const G=B.gasGroup; while(G.children.length)G.remove(G.children[0]);

    const m=new THREE.Mesh(new THREE.BoxGeometry(.95,.7,.95),new THREE.MeshBasicMaterial({color:0xb48cff,transparent:true,opacity:.22,depthWrite:false}));
    m.position.copy(W(i,j));m.position.y=.38;m.userData.gas=true;G.add(m);});

/* ---------- tick ---------- */
let fieldTarget=null;
function tick(dt){
  const t=performance.now()/1000;
  if(B.anchorGroup) B.anchorGroup.children.forEach(o=>{if(o.userData.spin){o.rotation.y+=dt*2;o.position.y=.45+Math.sin(t*3)*.05;}});
  if(B.gasGroup) B.gasGroup.children.forEach((o,k)=>{o.material.opacity=.18+Math.sin(t*2+k)*.06;});
  const m=B.mech;
  if(m.mesh && m.alive){ m.mesh.userData.core.material.color.setHSL(.07,1,.45+Math.sin(t*4)*.1); }
  if(B.phase==='field') fieldTick(dt);
  else{
    ['ryan','claire'].forEach(k=>{const u=B.units[k];if(u.target)u.mesh.position.lerp(u.target,Math.min(1,dt*10));
      u.mesh.userData.ring.material.opacity=(B.sel===k&&B.phase==='player')?.9:0;});
    if(m.target&&m.alive)m.mesh.position.lerp(m.target,Math.min(1,dt*6));
  }
}
function fieldTick(dt){
  const m=B.mech, c=B.units.claire;
  if(m.wait>0){m.wait-=dt;} else { m.x+=m.dir*dt*.9; if(m.x>2.2||m.x<-2.2){m.x=Math.max(-2.2,Math.min(2.2,m.x));m.dir*=-1;m.wait=1.2;} }
  m.mesh.position.set(m.x,0,m.z);
  const face=m.wait>0?-m.dir:m.dir; // turning at ends
  const ang=face>0?Math.PI/2:-Math.PI/2; m.mesh.rotation.y=ang;
  B.cone.position.set(m.x,.03,m.z); B.cone.rotation.z=face>0?0:Math.PI;
  // claire movement
  if(fieldTarget){const p=c.mesh.position, d=fieldTarget.clone().sub(p); d.y=0; const L=d.length();
    if(L<.05) fieldTarget=null; else {p.add(d.normalize().multiplyScalar(Math.min(L,dt*2.6))); c.mesh.rotation.y=Math.atan2(d.x,d.z);} }
  // detection & strike check
  const rel=new THREE.Vector3(c.mesh.position.x-m.x,0,c.mesh.position.z-m.z); const dist=rel.length();
  const fwd=new THREE.Vector3(face,0,0);
  const cos=dist>0?rel.dot(fwd)/dist:1;
  if(dist<3.2 && cos>Math.cos(.9)){ spotted(); return; }
  const behind = cos < -Math.cos(1.0);
  const can = dist<1.7 && behind;
  $('strike').disabled=!can;
  $('strike').textContent = can?'重擊冷卻水箱！':(dist<1.7?'繞到它背後':'接近機甲背後');
  m.mesh.userData.tank.material.emissive.setHex(can?0x2a6aaa:0x0b2a4a);
}
function snapField(){
  const m=B.mech; m.i=Math.round(m.x+4); m.j=Math.round(m.z+4);
  const c=B.units.claire; c.i=Math.max(0,Math.min(8,Math.round(c.mesh.position.x+4))); c.j=Math.max(0,Math.min(8,Math.round(c.mesh.position.z+4)));
  if(c.i===m.i&&c.j===m.j){ c.j=Math.min(8,c.j+1); }
  const r=B.units.ryan; if(c.i===r.i&&c.j===r.j){ c.i=c.i>0?c.i-1:c.i+1; }
  m.mesh.rotation.y=0;
}
function spotted(){
  if(B.phase!=='field')return; B.phase='trans'; fieldTarget=null;
  snapField(); banner('被發現了','機甲轉身迎擊・無先攻');
  log('機甲的感測器捕捉到克蕾雅，沒有取得先攻。');
  setTimeout(()=>startTactical(false),1400);
}
$('strike').onclick=()=>{
  if(B.phase!=='field')return; B.phase='trans'; fieldTarget=null; snapField();
  const m=B.mech; m.stun=1; B.ambush=true;
  for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const i=m.i+di,j=m.j+dj;if(inb(i,j)&&B.tiles[i][j]==='floor')B.tiles[i][j]='water';}
  [[m.i-2,m.j],[m.i+2,m.j]].forEach(([i,j])=>{i=Math.max(0,Math.min(8,i));if(B.tiles[i][j]!=='floor'&&B.tiles[i][j]!=='water')j=Math.min(8,j+1);B.tiles[i][j]='scrap';});
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)refreshTile(i,j);
  m.mesh.userData.tank.visible=false; damageMech(50,{raw:true,quiet:true});
  floatAt(W(m.i,m.j),'水箱破裂！','#7fc4ff');

  log('水箱破裂：機甲暈眩 1 回合，周圍 3×3 化為積水，掉落兩塊廢鐵甲（Fe×2）。');

};

/* ---------- helpers ---------- */
const inb=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const md=(a,b,c,d)=>Math.abs(a-c)+Math.abs(b-d);
function occupied(i,j,ignore){
  for(const k of ['ryan','claire']){const u=B.units[k];if(u!==ignore&&u.alive&&u.i===i&&u.j===j)return true;}
  if(B.mech.alive&&B.mech!==ignore&&B.mech.i===i&&B.mech.j===j)return true;
  return B.tiles[i][j]==='wall';
}
function reach(u,steps){
  const out=new Map(), q=[[u.i,u.j,0]], seen=new Set([u.i+','+u.j]);
  while(q.length){const [i,j,d]=q.shift(); if(d>0)out.set(i+','+j,{i,j,d});
    if(d>=steps)continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const ni=i+a,nj=j+b,k=ni+','+nj;
      if(inb(ni,nj)&&!seen.has(k)&&!occupied(ni,nj,u)){seen.add(k);q.push([ni,nj,d+1]);}});}
  return out;
}
function cellsOfShape(pts){
  if(pts.length===1) return [[pts[0].i,pts[0].j]];
  if(pts.length===2){ const [a,b]=pts; const out=[]; const n=Math.max(Math.abs(b.i-a.i),Math.abs(b.j-a.j));
    for(let k=0;k<=n;k++){const i=Math.round(a.i+(b.i-a.i)*k/(n||1)),j=Math.round(a.j+(b.j-a.j)*k/(n||1));if(!out.some(c=>c[0]===i&&c[1]===j))out.push([i,j]);} return out;}
  const poly=orderPoly(pts.map(p=>({x:p.i,z:p.j})));
  const out=[]; for(let i=0;i<N;i++)for(let j=0;j<N;j++){ if(inPoly(i,j,poly)||pts.some(p=>p.i===i&&p.j===j)) out.push([i,j]); }
  return out;
}
function inPoly(x,z,poly){ // includes edges with tolerance
  let inside=false; for(let a=0,b=poly.length-1;a<poly.length;b=a++){
    const xi=poly[a].x,zi=poly[a].z,xj=poly[b].x,zj=poly[b].z;
    const cross=(x-xi)*(zj-zi)-(z-zi)*(xj-xi); const dot=(x-xi)*(xj-xi)+(z-zi)*(zj-zi); const len=(xj-xi)**2+(zj-zi)**2;
    if(Math.abs(cross)<.6*Math.sqrt(len)&&dot>=0&&dot<=len) return true;
    if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi)) inside=!inside;}
  return inside;
}
function mechIn(cells){return B.mech.alive&&cells.some(([i,j])=>i===B.mech.i&&j===B.mech.j);}
function mechNear(cells,r=1){return B.mech.alive&&cells.some(([i,j])=>md(i,j,B.mech.i,B.mech.j)<=r);}

/* ---------- damage & fx ---------- */
function damageMech(amt,o={}){
  const m=B.mech; if(!m.alive)return;
  let d=amt; if(!o.true&&!o.raw&&m.tg>0) d=Math.round(d*.2);
  m.hp=Math.max(0,m.hp-d);
  if(!o.quiet) floatAt(W(m.i,m.j),'-'+d,o.true?'#ffd27a':'#ff7a6a');
  if(o.tg){ const before=m.tg; m.tg=Math.max(0,m.tg-o.tg); if(o.tg&&!o.quiet)floatAt(W(m.i,m.j).add(new THREE.Vector3(.4,.6,0)),'裝甲 -'+(before-m.tg),'#c9a24a');
    if(before>0&&m.tg===0){ banner('BREAK','外裝甲粉碎・全傷害生效'); m.stun=Math.max(m.stun,1); log('外裝甲歸零：機甲 BREAK，暈眩 1 回合。'); } }
  updateHud();
  if(m.hp<=0){ m.alive=false; mechDie(); }
}
function damageUnit(u,amt){
  if(!u.alive)return; let d=amt; if(u.arm) d=Math.max(5,Math.round(d-u.arm*.5));
  if(u.key==='claire'&&save.mods.frame==='F3') d=Math.round(d/2);
  u.hp=Math.max(0,u.hp-d); floatAt(u.mesh.position.clone(),'-'+d,'#ff7a6a');
  if(u.hp===0){u.alive=false;u.mesh.visible=false;log(`${u.name}倒下了。`);}
  renderDeck();
}
function floatAt(v,txt,color){
  const p=v.clone(); p.y+=1.3; p.project(R3.camera);
  const r=$('gl').getBoundingClientRect();
  const d=document.createElement('div'); d.className='ftxt'; d.textContent=txt; d.style.color=color;
  d.style.left=(r.left+(p.x+1)/2*r.width)+'px'; d.style.top=(r.top+(1-p.y)/2*r.height)+'px';
  $('ftl').appendChild(d); setTimeout(()=>d.remove(),1400);
}
function banner(a,b){const e=$('banner');e.innerHTML=a+(b?`<small>${b}</small>`:'');e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}
function log(t){const d=document.createElement('div');d.textContent=t;$('log').prepend(d);setTimeout(()=>d.remove(),6200);}
function guide(h,t){$('g-head').textContent=h;$('g-text').textContent=t;}
function mechDie(){
  const m=B.mech; banner('擊破','重裝蒸氣警衛機甲');
  const g=m.mesh; let k=0; const iv=setInterval(()=>{k++;g.rotation.z+=.06;g.position.y-=.03;g.scale.multiplyScalar(.97);if(k>40){clearInterval(iv);g.visible=false;}},30);
  B.phase='done';

}
function updateHud(){
  const m=B.mech;
  $('h-hp').textContent=`${m.hp} / ${m.max}`; $('b-hp').style.width=(m.hp/m.max*100)+'%';
  $('h-tg').textContent=`${m.tg} / ${m.tgMax}`; $('b-tg').style.width=(m.tg/m.tgMax*100)+'%';
  $('h-cell').textContent=`[L0] (${m.i},${m.j})`;
  const tags=[]; if(m.stun)tags.push(['暈眩 '+m.stun,1]); if(m.root)tags.push(['定身 '+m.root,1]); if(m.tg===0)tags.push(['BREAK',1]);
  if(m.tg>0)tags.push(['直接傷害 -80%',0]);
  const inGas=B.gas.has(m.i+','+m.j)||[...B.gas].some(k=>{const [i,j]=k.split(',').map(Number);return md(i,j,m.i,m.j)<=1;});
  if(inGas)tags.push(['氫氧氣雲中',1]);
  $('h-tags').innerHTML=tags.map(([t,h])=>`<span class="tag${h?' hot':''}">${t}</span>`).join('');
}

function payPlan(r){
  const need={}; r.el.forEach(e=>need[e]=(need[e]||0)+1);
  const cells=r.n>=3?cellsOfShape(B.anchors.slice(-r.n)):[];
  const plan={};
  for(const [e,n] of Object.entries(need)){
    const fromPool=Math.min(n,B.pool[e]||0); let rest=n-fromPool;
    if(rest>0){ const onsite=cells.filter(([i,j])=>TILE_EL[B.tiles[i][j]]===e).length; if(onsite>=rest) rest=0; }
    if(rest>0) return null; plan[e]=fromPool;

  if(!U[B.sel].alive) B.sel=U.ryan.alive?'ryan':'claire';
  banner(`第 ${B.turn} 回合`);
  guide(`第 ${B.turn} 回合`, B.gas.size?'氣雲還在場上，克蕾雅的火銃射程 4 格，點燃它。':B.anchors.length?'錨點留著會被機甲踩碎，盡量在同一回合連線發動。':'定身後的機甲踩不到錨點。先用 #R08 或急凍把它固定，再慢慢佈陣。');
  updateHud(); renderDeck();
}
async function approach(m){
  const U=['ryan','claire'].map(k=>B.units[k]).filter(u=>u.alive); if(!U.length)return;
  const r=reach(m,2); let best=null;
  r.forEach(c=>{const d=Math.min(...U.map(u=>md(u.i,u.j,c.i,c.j))); if(d>=1&&(!best||d<best.dd||(d===best.dd&&c.d<best.d)))best={...c,dd:d};});
  const cur=Math.min(...U.map(u=>md(u.i,u.j,m.i,m.j)));
  if(best&&best.dd<cur){ m.i=best.i;m.j=best.j;placeUnits(false); await sleep(500); }
}
function lineBlocked(a,b){ const cells=cellsOfShape([{i:a.i,j:a.j},{i:b.i,j:b.j}]); return cells.some(([i,j])=>B.tiles[i][j]==='wall'); }
function defeat(){
  B.phase='done';
  $('ov').innerHTML=`<div class="overlay"><div class="card"><h3>小隊潰滅</h3><p>重裝機甲還站在機庫中央。換一套配裝再試一次：#R08 鐵枷能先把它定住，石牆可以擋下蒸氣砲。</p>
   <div class="row"><button class="btn primary" id="ov-retry">重新挑戰</button><button class="btn" id="ov-base">回整備基地</button></div></div></div>`;
  $('ov-retry').onclick=()=>{$('ov').innerHTML='';startBattle(B.onWin);};
  $('ov-base').onclick=()=>{$('ov').innerHTML='';const f=B.onWin;openBase(f);};
}

   <p>五百名礦工的記憶回到了他們身上。音叉浮現的駐波刻度，指向北方的極寒要塞「白銀之顎」。</p>
   <p class="note">第二章（高低差、滑冰與凍僵）製作中。#R16、#R17 將在第二章解鎖。</p>
   <div class="row"><button class="btn primary" id="ce-t">回到標題</button><button class="btn" id="ce-b">再戰機庫</button></div></div></div>`;
  $('ce-t').onclick=()=>{$('ov').innerHTML='';};
  $('ce-b').onclick=()=>{$('ov').innerHTML='';openBase(()=>playScene(SCENES.ch1b,chapterEnd));};
}
function newGame(){
  playScene(SCENES.prologue.concat(SCENES.ch1a),()=>{
    openBase(()=>playScene(SCENES.ch1b,chapterEnd));
  });
}
$('m-new').onclick=newGame;

show('title');
</script>
